esphome:
  name: lillygo-t-dongle-s3-ble
  friendly_name: "LilyGo T-Dongle S3 BLE Proxy"
  platform: esp32
  board: esp32-s3-devkitc-1
  variant: esp32s3

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "LilyGo-T-Dongle-S3"
    password: "12345678"

# Over-the-Air Updates
ota:
  password: !secret ota_password

# Logging
logger:
  level: DEBUG

# API for Home Assistant
api:
  encryption:
    key: !secret api_key

# Sync time with Home Assistant
time:
  - platform: homeassistant
    id: homeassistant_time

# SPI Bus for ST7789 Display
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

# ST7789 LCD Display (240x280)
display:
  - platform: st7789v
    id: lcd_display
    cs_pin: GPIO10
    dc_pin: GPIO13
    reset_pin: GPIO9
    backlight_pin: GPIO14
    rotation: 0
    width: 240
    height: 280
    lambda: |-
      auto time_str = id(homeassistant_time).now().strftime("%H:%M:%S");
      auto date_str = id(homeassistant_time).now().strftime("%m/%d/%Y");
      
      // Clear screen
      it.fill(Color(0, 0, 0));
      
      // Title
      it.printf(120, 10, id(font_large), Color(255, 255, 255), TextAlign::TOP_CENTER, "BLE Proxy");
      
      // WiFi Status
      it.printf(10, 40, id(font_medium), Color(100, 200, 100), TextAlign::TOP_LEFT, "WiFi: %s", id(wifi_info_text).state.c_str());
      
      // Date and Time
      it.printf(230, 40, id(font_small), Color(150, 150, 255), TextAlign::TOP_RIGHT, "%s", date_str.c_str());
      it.printf(230, 55, id(font_medium), Color(255, 255, 100), TextAlign::TOP_RIGHT, "%s", time_str.c_str());
      
      // Separator line
      it.line(10, 75, 230, 75, Color(100, 100, 100));
      
      // BLE Device Count
      it.printf(10, 85, id(font_large), Color(255, 100, 100), TextAlign::TOP_LEFT, "Devices: %s", id(ble_device_count).state.c_str());
      
      // Connected Devices
      int line_height = 35;
      int start_y = 125;
      
      // Device 1
      if (id(ble_device_1).state.length() > 0) {
        it.filled_rectangle(5, start_y - 5, 230, 30, Color(30, 30, 50));
        it.printf(15, start_y, id(font_medium), Color(150, 200, 255), TextAlign::TOP_LEFT, "1: %s", id(ble_device_1).state.c_str());
      }
      
      // Device 2
      if (id(ble_device_2).state.length() > 0) {
        it.filled_rectangle(5, start_y + line_height - 5, 230, 30, Color(30, 30, 50));
        it.printf(15, start_y + line_height, id(font_medium), Color(150, 200, 255), TextAlign::TOP_LEFT, "2: %s", id(ble_device_2).state.c_str());
      }
      
      // Device 3
      if (id(ble_device_3).state.length() > 0) {
        it.filled_rectangle(5, start_y + (line_height * 2) - 5, 230, 30, Color(30, 30, 50));
        it.printf(15, start_y + (line_height * 2), id(font_medium), Color(150, 200, 255), TextAlign::TOP_LEFT, "3: %s", id(ble_device_3).state.c_str());
      }
      
      // Signal strength at bottom
      it.printf(10, 270, id(font_small), Color(200, 150, 100), TextAlign::BOTTOM_LEFT, "Signal: %s dBm", id(ble_signal_strength).state.c_str());

# Fonts
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_medium
    size: 16
  - file: "gfonts://Roboto"
    id: font_large
    size: 22

# BLE Scanner
esp32_ble_tracker:
  scan_parameters:
    interval: 1.1s
    window: 1.1s
    duration: 30s
    active: true
    continuous: true

# Text Sensors for BLE Device Names
text_sensor:
  - platform: template
    name: "WiFi Info"
    id: wifi_info_text
    update_interval: 5s
    lambda: |-
      if (wifi::global_wifi_component->is_connected()) {
        return {"Connected"};
      } else {
        return {"Disconnected"};
      }
    icon: mdi:wifi

  - platform: template
    name: "BLE Device 1"
    id: ble_device_1
    icon: mdi:bluetooth
    update_interval: never
    
  - platform: template
    name: "BLE Device 2"
    id: ble_device_2
    icon: mdi:bluetooth
    update_interval: never
    
  - platform: template
    name: "BLE Device 3"
    id: ble_device_3
    icon: mdi:bluetooth
    update_interval: never
    
  - platform: template
    name: "BLE Device 4"
    id: ble_device_4
    icon: mdi:bluetooth
    update_interval: never
    
  - platform: template
    name: "BLE Device 5"
    id: ble_device_5
    icon: mdi:bluetooth
    update_interval: never

# Numeric Sensors for BLE Signal Strength
sensor:
  - platform: template
    name: "BLE Device Count"
    id: ble_device_count
    unit_of_measurement: "devices"
    icon: mdi:counter
    update_interval: 10s
    lambda: |-
      return (float)bluetooth::global_ble_devices->size();
    
  - platform: template
    name: "BLE Signal Strength"
    id: ble_signal_strength
    unit_of_measurement: "dBm"
    icon: mdi:signal-variant
    update_interval: 5s
    lambda: |-
      if (bluetooth::global_ble_devices->size() > 0) {
        auto device = *bluetooth::global_ble_devices->begin();
        return (float)device.rssi;
      }
      return 0.0;

# Binary Sensors for Device Detection
binary_sensor:
  - platform: esp32_ble_tracker
    name: "Generic BLE Device"
    service_uuid: "0000180A-0000-1000-8000-00805F9B34FB"
